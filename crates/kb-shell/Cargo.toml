[package]
name = "kb-shell"
description = "Kendime-Brow browser main process: window, tabs, request filter, action registry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kendime-brow"
path = "src/main.rs"

[[bin]]
name = "kb-shell-helper"
path = "src/bin/kb-shell-helper.rs"

[features]
default = []
sandbox = ["cef/sandbox"]

[dependencies]
cef.workspace = true
kb-platform.workspace = true
kb-actions.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rust-embed = "8.14.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }


