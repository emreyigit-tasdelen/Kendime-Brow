[package]
name = "kb-shell"
description = "Kendime-Brow browser main process: window, tabs, request filter, action registry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kendime-brow"
path = "src/main.rs"

[[bin]]
name = "kb-shell-helper"
path = "src/bin/kb-shell-helper.rs"

[features]
default = []
sandbox = ["cef/sandbox"]

[dependencies]
cef.workspace = true
kb-platform.workspace = true
kb-actions.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
rust-embed = "8.14.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
kb-privacy.workspace = true
sysinfo = "0.40.3"
minisign-verify = "0.3.0"
ureq = "3.5"
sha2 = "0.10"
kb-ipc.workspace = true
tokio = { version = "1.54.1", features = ["rt", "time", "macros"] }
base64 = "0.23.1"
portable-pty = "0.9.0"
kb-vault = { path = "../kb-vault" }
kb-ssh = { path = "../kb-ssh" }
kb-net = { path = "../kb-net" }
kb-userscript = { path = "../kb-userscript" }
getrandom = "0.4"
cms = { version = "0.2.3", features = ["builder"] }
rsa = { version = "0.9", features = ["sha2"] }
const-oid = "0.9"
spki = "0.7"
signature = "2"
pkcs8 = { version = "0.10", features = ["pem"] }
pem-rfc7468 = "0.7"
x509-cert = "0.2"
der = "0.7"


