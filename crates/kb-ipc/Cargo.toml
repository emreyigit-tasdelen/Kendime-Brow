[package]
name = "kb-ipc"
description = "IPC transport, protobuf message types and module host launching (architecture §3.3)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4"
kb-platform.workspace = true
prost = "0.14"
tokio = { version = "1", features = ["io-util"] }

[build-dependencies]
prost-build = "0.14"
protox = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "io-util"] }
