[package]
name = "kb-doc"
description = "Document host: PDF (PDFium) and later Office (architecture §6, §7)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
calamine = "0.38.0"

image = { version = "0.25.10", default-features = false, features = ["png"] }
kamadak-exif = "0.6.2"
kb-ipc.workspace = true
kb-platform.workspace = true
pdfium-render = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time"] }
