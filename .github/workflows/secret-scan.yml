name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan full history
        run: gitleaks git --redact --no-banner --config .gitleaks.toml .
      - name: Block AI attribution and non-noreply authors
        run: |
          if git log --format='%B' | grep -qiE '^Co-Authored-By:.*(claude|anthropic)'; then
            echo "AI attribution line found in history"; exit 1
          fi
          if git log --format='%ae' | grep -vqE '@users\.noreply\.github\.com$|^noreply@github\.com$'; then
            echo "Non-noreply author email found in history"; exit 1
          fi
